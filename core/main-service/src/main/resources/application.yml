server:
  port: 0

spring:
  application:
    name: main-service

  config:
    import: "optional:configserver:"

  datasource:
    url: jdbc:postgresql://localhost:6543/ewm
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka