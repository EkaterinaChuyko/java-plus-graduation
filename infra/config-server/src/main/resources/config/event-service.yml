server:
  port: 0

spring:
  application:
    name: event-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5434/event
    username: event
    password: event
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN