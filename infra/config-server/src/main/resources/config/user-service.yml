server:
  port: 0

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5435/user
    username: user
    password: user
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true