server:
  port: 0

grpc:
  server:
    port: 0
    in-process-enabled: false

spring:
  application:
    name: collector

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

logging:
  level:
    root: INFO
    ru.practicum.stats.collector: DEBUG

topics:
  user-action: stats.user-actions.v1
  event-similarity: stats.events-similarity.v1

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: ru.practicum.ewm.serializer.GeneralAvroSerializer