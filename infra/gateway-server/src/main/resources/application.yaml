server:
  port: 8080

spring:
  application:
    name: gateway-server

  main:
    web-application-type: reactive

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: main-service
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/admin/**,/users/**,/events/**,/compilations/**,/categories/**

        - id: stats-hit
          uri: lb://STATS-SERVER
          predicates:
            - Path=/hit/**

        - id: stats
          uri: lb://STATS-SERVER
          predicates:
            - Path=/stats/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true