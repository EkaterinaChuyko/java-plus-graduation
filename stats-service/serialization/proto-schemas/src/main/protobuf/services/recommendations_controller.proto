syntax = "proto3";

package stats.service.dashboard;

option java_multiple_files = true;
option java_package = "ru.practicum.stats.grpc.dashboard";

import "messages/recommendation.proto";

service RecommendationsController {

  rpc GetRecommendationsForUser (
      stats.message.recommendation.UserPredictionsRequestProto
  ) returns (
      stream stats.message.recommendation.RecommendedEventProto
  );

  rpc GetSimilarEvents (
      stats.message.recommendation.SimilarEventsRequestProto
  ) returns (
      stream stats.message.recommendation.RecommendedEventProto
  );

  rpc GetInteractionsCount (
      stats.message.recommendation.InteractionsCountRequestProto
  ) returns (
      stream stats.message.recommendation.RecommendedEventProto
  );
}